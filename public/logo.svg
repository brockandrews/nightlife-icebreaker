<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="#0B0E14" />
  <rect width="512" height="512" rx="112" stroke="#1E293B" stroke-width="8" fill="none" />
  
  <!-- Interlocking M & X Geometric Symbol -->
  <g filter="url(#neonGlow)" stroke="url(#cyanPurpleGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left X Arm / M leg -->
    <path d="M 120 180 L 220 332 L 256 270 L 190 180" />
    <path d="M 120 332 L 220 180" />
    <!-- Center M Peak & Valley -->
    <path d="M 220 180 L 256 235 L 292 180" />
    <!-- Right X Arm / M leg -->
    <path d="M 392 180 L 292 332 L 256 270 L 322 180" />
    <path d="M 392 332 L 292 180" />
  </g>
</svg>
